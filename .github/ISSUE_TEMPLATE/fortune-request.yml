name: 맞춤 운세 요청
description: 다른 사람 사주로 운세 받기
title: "[운세] 요청"
labels: ["fortune-request"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ 이 폼은 운세 페이지의 입력 섹션에서 자동으로 채워집니다. 수동으로 작성할 경우 모든 항목을 정확히 입력해야 합니다.

        제출 후 처리 완료까지 1~2분 정도 소요되며, 결과는 다음 운세 발송 시 카카오톡으로 전달됩니다.
  - type: input
    id: name
    attributes:
      label: 이름
      description: 표시용 (선택)
      placeholder: 홍길동
    validations:
      required: false
  - type: input
    id: birth_date
    attributes:
      label: 생년월일
      description: YYYY-MM-DD 형식 (양력 기준)
      placeholder: "1990-03-15"
    validations:
      required: true
  - type: input
    id: birth_hour
    attributes:
      label: 생시
      description: 0~23 사이 숫자 (오전 10시 = 10, 밤 11시 = 23)
      placeholder: "12"
    validations:
      required: true
  - type: dropdown
    id: yongsin
    attributes:
      label: 용신 (가장 도움되는 오행)
      options:
        - 토
        - 금
        - 수
        - 목
        - 화
    validations:
      required: true
  - type: dropdown
    id: huisin
    attributes:
      label: 희신 (보조 오행)
      description: 모르거나 없으면 "없음"
      options:
        - 없음
        - 토
        - 금
        - 수
        - 목
        - 화
    validations:
      required: false
  - type: dropdown
    id: gisin
    attributes:
      label: 기신 (가장 해로운 오행)
      options:
        - 화
        - 목
        - 수
        - 금
        - 토
    validations:
      required: true
