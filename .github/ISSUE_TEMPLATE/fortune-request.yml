name: 맞춤 운세 요청
description: 다른 사람 사주로 운세 받기
title: "[운세] 요청"
labels: ["fortune-request"]
body:
  - type: markdown
    attributes:
      value: |
        이 폼은 운세 페이지의 입력 섹션에서 자동으로 채워집니다. 수동으로 작성할 경우 생년월일은 반드시 입력해야 합니다.

        용신·희신·기신은 사주 분포 기반으로 **자동 계산**됩니다.

        결과는 다음 운세 발송 시 카카오톡으로 전달됩니다 (1~2분 후 이슈가 자동으로 닫힙니다).
  - type: input
    id: name
    attributes:
      label: 이름
      description: 표시용 (선택)
      placeholder: 홍길동
    validations:
      required: false
  - type: input
    id: birth_date
    attributes:
      label: 생년월일
      description: YYYY-MM-DD 형식 (양력 기준)
      placeholder: "1990-03-15"
    validations:
      required: true
  - type: input
    id: birth_hour
    attributes:
      label: 생시 (선택)
      description: 0~23 사이 숫자. 모르면 비워두세요 (시주 없이 계산).
      placeholder: "10"
    validations:
      required: false
