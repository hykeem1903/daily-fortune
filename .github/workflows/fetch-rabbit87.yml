name: fetch-rabbit87

# 매일신문 87년생 토끼띠 운세를 긁어 output/rabbit87.json 저장.
# 07:02 KST 클라우드 루틴(카톡 발송)이 이 파일을 읽는다.
# cron은 UTC: 20:06/20:46/21:26 = KST 05:06/05:46/06:26
# 정각·20분·40분은 Actions cron 큐 혼잡으로 지연·누락이 잦아(8/28 24시간+ 미발동 사고) 어중간한 분으로 회피.
# cron이 통째로 안 도는 날 대비: promote-fortune.yml이 매일 아침 승격 직후 이 워크플로우를 백업 dispatch.
# 스크립트가 오늘자 ok 데이터 존재 시 즉시 종료하므로 중복 실행은 무해.
on:
  schedule:
    - cron: '6 20 * * *'
    - cron: '46 20 * * *'
    - cron: '26 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_rabbit87.py'
      - '.github/workflows/fetch-rabbit87.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 운세 추출
        run: python3 scripts/fetch_rabbit87.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/rabbit87.json
          git diff --cached --quiet && echo "no changes" || git commit -m "rabbit87: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
