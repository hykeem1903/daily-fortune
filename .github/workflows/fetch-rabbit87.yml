name: fetch-rabbit87

# 매일신문 87년생 토끼띠 운세를 긁어 output/rabbit87.json 저장.
# 07:02 KST 클라우드 루틴(카톡 발송)이 이 파일을 읽는다.
# cron은 UTC: 20:00/20:40/21:20 = KST 05:00/05:40/06:20 (Actions 지연 최대 1시간 흥수용 3회)
on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '40 20 * * *'
    - cron: '20 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_rabbit87.py'
      - '.github/workflows/fetch-rabbit87.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 운세 추출
        run: python3 scripts/fetch_rabbit87.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/rabbit87.json
          git diff --cached --quiet && echo "no changes" || git commit -m "rabbit87: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
