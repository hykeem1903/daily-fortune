name: 이슈 운세 요청 처리

on:
  issues:
    types: [opened, reopened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'fortune-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 이슈 본문 파싱 + custom_fortune 실행 + output 평문 생성
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/parse_issue.py

      - name: pending.json + output/<slug>.txt 커밋 (build_page workflow 자동 발동)
        run: |
          git config user.email "fortune-bot@auto"
          git config user.name "Fortune Bot"
          git add requests/pending.json output/
          git commit -m "맞춤 운세 요청 #${{ github.event.issue.number }} (${{ github.event.issue.title }})"
          git push

      - name: 이슈에 정식 URL 코멘트 + 닫기
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.parse.outputs.page_url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '✅ 요청 접수 + 페이지 발행 진행 중.\n\n📄 정식 페이지 ▶ ' + url + '\n\n사이트 빌드 1~2분 후 접근 가능. 풀해설 카톡은 다음 routine 정시 발동 때 발송.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });

  fail-notice:
    if: failure()
    runs-on: ubuntu-latest
    needs: process
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '❌ 요청 처리 실패. Actions 로그를 확인해줘.'
            });
