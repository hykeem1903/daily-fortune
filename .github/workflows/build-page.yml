name: 운세 페이지 빌드

on:
  push:
    paths:
      - 'output/**.txt'
      - '.github/scripts/build_page.py'
      - '.github/workflows/build-page.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 main
        uses: actions/checkout@v4

      - name: 체크아웃 gh-pages (기존 아카이브)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: existing_site
        continue-on-error: true

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛡 DATE+WEEKDAY GUARD — today.txt 헤더(날짜·요일) vs fortune_calc 실제 sync 검증
        run: |
          python3 << 'PYEOF'
          import json, re, subprocess, sys, datetime
          raw = open('output/today.txt', encoding='utf-8').read()
          first = raw.split('\n')[0]
          m = re.search(r'(\d{4}-\d{2}-\d{2})', first)
          if not m:
              sys.exit(f'❌ today.txt 헤더에 YYYY-MM-DD 없음: {first[:60]}')
          header = m.group(1)
          r = subprocess.run(['python3', 'fortune_calc.py'], capture_output=True, text=True)
          if r.returncode != 0:
              sys.exit(f'❌ fortune_calc.py 실행 실패: {r.stderr}')
          real = json.loads(r.stdout)['date']
          if header != real:
              sys.exit(
                  f'❌ DATE MISMATCH: today.txt 헤더={header} vs fortune_calc(무인자) KST 실제={real}.\n'
                  f'사이트 빌드 차단. routine LLM이 어제/내일 날짜로 today.txt 작성 시 발동. \n'
                  f'5/19, 5/31, 6/5 동일 패턴 재발 방지 가드. fortune_calc.py 무인자 = ground truth.'
              )
          # ★ WEEKDAY GUARD — 날짜는 맞아도 요일 틀린 발송 차단 (6/25 재발 방지)
          mw = re.search(r'\(([월화수목금토일])요일\)', first)
          hdr_wk = mw.group(1) if mw else '?'
          true_wk = '월화수목금토일'[datetime.date.fromisoformat(header).weekday()]
          if hdr_wk != true_wk:
              sys.exit(
                  f'❌ WEEKDAY MISMATCH: today.txt 헤더요일={hdr_wk} vs {header} 실제요일={true_wk}.\n'
                  f'사이트 빌드 차단. 날짜는 맞아도 요일이 틀린 케이스. 6/25 재발 방지 가드.'
              )
          print(f'✅ DATE+WEEKDAY SYNC: {header} ({true_wk}요일) = fortune_calc {real}')
          PYEOF

      - name: HTML 생성 (30일 보관)
        run: python3 .github/scripts/build_page.py

      - name: gh-pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
