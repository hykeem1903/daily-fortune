name: 발송 검증 게이트

# 원격 루틴이 output/today.txt를 push하는 "그 순간" 자동 실행 (맥 상태 무관, 발송 직후 확실)
on:
  push:
    paths:
      - 'output/today.txt'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 발송물 검증 (날짜·요일·필드·포맷·코드무결성)
        run: |
          set -uo pipefail
          TODAY=$(TZ='Asia/Seoul' date +%F)
          HDR=$(head -1 output/today.txt | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || echo '?')
          FAIL=""

          # 1) 날짜: 헤더 == 오늘 KST (어제 날짜 발송 재발 차단 — 최우선)
          [ "$HDR" != "$TODAY" ] && FAIL="${FAIL} [날짜 $HDR≠$TODAY]"

          # 2) ★요일: 헤더 (X요일) == 헤더 날짜 실제 요일 (날짜 맞아도 요일 틀린 발송 차단 — 6/25 재발 방지). 단일라인 python
          WKCHK=$(python3 -c "import datetime,re,sys; f=open('output/today.txt',encoding='utf-8').read().split(chr(10))[0]; m=re.search(r'(\\d{4}-\\d{2}-\\d{2}).*?\\(([월화수목금토일])요일\\)',f); WK='월화수목금토일'; print('NOWK') if not m else print('OK' if m.group(2)==WK[datetime.date.fromisoformat(m.group(1)).weekday()] else m.group(2)+'!='+WK[datetime.date.fromisoformat(m.group(1)).weekday()])")
          [ "$WKCHK" != "OK" ] && FAIL="${FAIL} [요일 $WKCHK]"

          # 3) 일진 정합: 만세력 한자 두 글자가 본문 일진줄에 (LLM 창작 차단)
          EXP=$(python3 fortune_calc.py "$TODAY" | python3 -c "import json,sys;print(json.load(sys.stdin)['일진'])")
          C1=$(echo "$EXP" | cut -c1); C2=$(echo "$EXP" | cut -c2)
          ILINE=$(grep -E '^일진' output/today.txt || echo '')
          { echo "$ILINE" | grep -q "$C1" && echo "$ILINE" | grep -q "$C2"; } || FAIL="${FAIL} [일진불일치 기대=$EXP]"

          # 4) 새 필드 본문 반영
          grep -q "이달흐름" output/today.txt || FAIL="${FAIL} [이달흐름 누락]"

          # 5) 마크다운 오염 차단 (단일 백슬래시 — 과escape 시 grep이 모든 줄 매칭하는 버그 회피)
          grep -qE '^\*\*|^##|^> ' output/today.txt && FAIL="${FAIL} [마크다운 오염]"

          # 6) 코드 무결성: fortune_calc 새 필드 산출
          python3 fortune_calc.py "$TODAY" | python3 -c "import json,sys;d=json.load(sys.stdin);sys.exit(0 if all(k in d for k in ['월운','원국_충합','신체_주의','수비모드','숨은글자_지장간']) else 1)" || FAIL="${FAIL} [코드 구버전]"

          if [ -n "$FAIL" ]; then
            echo "::error::발송 검증 실패 —$FAIL"
            echo "FAILMSG=$FAIL" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "✅ 발송 검증 통과: $TODAY $EXP (요일 $WKCHK)"

      - name: 실패 시 GitHub 이슈 생성 (이메일 자동 알림)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('sv', {timeZone:'Asia/Seoul'});
            const msg = process.env.FAILMSG || '검증 실패';
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `⚠️ 운세 발송 검증 실패 — ${today}`,
              body: `자동 검증 실패 (발송 직후 게이트).\n\n**실패 사유:**${msg}\n\n워크플로우: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\noutput/today.txt 확인. 어제 날짜/요일 발송이면 SCHEDULE_PROMPT STEP 0-A 점검.`,
              labels: ['발송오류']
            });
